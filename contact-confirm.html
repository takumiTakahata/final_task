<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/contact-confirm.css" />
    <title>お問い合わせ確認</title>
  </head>
  <body>
    <header class="site-header">
      <h1><a href="index.html">Spring Music Festival 2026</a></h1>
      <button class="hamburger" id="hamburger" aria-label="メニュー">
        <img src="./img/menu.png" alt="メニュー" class="hamburger-icon" />
        <img src="./img/close.png" alt="閉じる" class="close-icon" />
        <p>menu</p>
      </button>
      <nav class="nav" id="nav">
        <ul>
          <li><a href="time-table.html">タイムテーブル</a></li>
          <li><a href="artists_index.html">出演者一覧</a></li>
          <li><a href="access.html">開催案内</a></li>
          <li><a href="ticket.html">チケット情報</a></li>
          <li><a href="goods.html">グッツ(Goods)紹介</a></li>
          <li><a href="guide.html">来場者ガイド</a></li>
          <li><a href="faq.html">よくある質問</a></li>
          <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>内容をご確認ください。</h1>
      <div class="confirm-content">
        <div class="confirm-item">
          <div class="confirm-label">問い合わせ種別</div>
          <div class="confirm-value">チケットについて</div>
        </div>
        <div class="confirm-item">
          <div class="confirm-label">お名前</div>
          <div class="confirm-value">質問 有太郎</div>
        </div>
        <div class="confirm-item">
          <div class="confirm-label">メールアドレス</div>
          <div class="confirm-value">sample@sample.com</div>
        </div>
        <div class="confirm-item">
          <div class="confirm-label">電話番号</div>
          <div class="confirm-value">080-1234-5678</div>
        </div>
        <div class="confirm-item">
          <div class="confirm-label">お問い合わせ内容</div>
          <div class="confirm-value">ここにお問い合わせ内容が入ります。</div>
        </div>
      </div>
      <div class="button-group">
        <button
          class="back-btn"
          onclick="window.location.href = 'contact.html'"
        >
          戻る
        </button>
        <button
          class="submit-btn"
          onclick="window.location.href = 'contact-thanks.html'"
        >
          送信
        </button>
      </div>
    </main>
    <footer>
      <p>&copy; 2025 Morijyobi. All rights reserved.</p>
    </footer>
    <script src="./js/header.js"></script>
    <script>
      const params = new URLSearchParams(window.location.search);
      document.querySelectorAll(".confirm-value")[0].textContent =
        params.get("type") || "-";
      document.querySelectorAll(".confirm-value")[1].textContent =
        params.get("name") || "-";
      document.querySelectorAll(".confirm-value")[2].textContent =
        params.get("email") || "-";
      document.querySelectorAll(".confirm-value")[3].textContent =
        params.get("phone") || "-";
      document.querySelectorAll(".confirm-value")[4].textContent =
        params.get("message") || "-";
    </script>
  </body>
</html>
