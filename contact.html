<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./css/styles.css" />
    <link rel="stylesheet" href="./css/contact.css" />
    <title>お問い合わせ</title>
  </head>
  <body>
    <header class="site-header">
      <h1><a href="index.html">Spring Music Festival 2026</a></h1>
      <button class="hamburger" id="hamburger" aria-label="メニュー">
        <img src="./img/menu.png" alt="メニュー" class="hamburger-icon" />
        <img src="./img/close.png" alt="閉じる" class="close-icon" />
        <p>menu</p>
      </button>
      <nav class="nav" id="nav">
        <ul>
          <li><a href="time-table.html">タイムテーブル</a></li>
          <li><a href="#lineup">出演者一覧</a></li>
          <li><a href="#tickets">開催案内</a></li>
          <li><a href="#ticket-info">チケット情報</a></li>
          <li><a href="#goods">グッツ(Goods)紹介</a></li>
          <li><a href="#guide">来場者ガイド</a></li>
          <li><a href="contact.html">お問い合わせ</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <h1>お問い合わせ</h1>
      <form class="contact-form">
        <div class="form-group">
          <label class="form-label"
            >お問い合わせ種別<span class="required">必須</span></label
          >
          <div class="radio-group">
            <div class="radio-row">
              <label class="radio-label">
                <input
                  type="radio"
                  name="inquiry-type"
                  value="ticket"
                  required
                />
                <span>チケットについて</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="inquiry-type" value="venue" />
                <span>会場について</span>
              </label>
            </div>
            <div class="radio-row">
              <label class="radio-label">
                <input type="radio" name="inquiry-type" value="info" />
                <span>公開情報について</span>
              </label>
              <label class="radio-label">
                <input type="radio" name="inquiry-type" value="other" />
                <span>その他</span>
              </label>
            </div>
          </div>
        </div>

        <div class="form-group">
          <label for="name" class="form-label"
            >お名前<span class="required">必須</span></label
          >
          <input
            type="text"
            id="name"
            name="name"
            placeholder="例：山田太郎"
            required
          />
        </div>

        <div class="form-group">
          <label for="email" class="form-label"
            >メールアドレス<span class="required">必須</span></label
          >
          <input
            type="email"
            id="email"
            name="email"
            placeholder="例：Email@example.com"
            required
          />
        </div>

        <div class="form-group">
          <label for="phone" class="form-label">電話番号</label>
          <input
            type="tel"
            id="phone"
            name="phone"
            placeholder="例：09012345678"
          />
        </div>

        <div class="form-group">
          <label for="message" class="form-label"
            >お問い合わせ内容<span class="required">必須</span></label
          >
          <textarea id="message" name="message" rows="5" required></textarea>
        </div>

        <div class="privacy-policy">
          <a href="#privacy"
            >プライバシーポリシーはこちらからご確認ください。</a
          >
        </div>

        <button type="submit" class="submit-btn">送信画面へ</button>
      </form>
    </main>
    <footer>
      <p>&copy; 2025 Morijyobi. All rights reserved.</p>
    </footer>
    <script src="./js/header.js"></script>
    <script>
      document
        .querySelector(".contact-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const inquiryType = document.querySelector(
            'input[name="inquiry-type"]:checked',
          );
          const inquiryLabels = {
            ticket: "チケットについて",
            venue: "会場について",
            info: "公開情報について",
            other: "その他",
          };
          const params = new URLSearchParams({
            type: inquiryLabels[inquiryType?.value] || "",
            name: document.getElementById("name").value,
            email: document.getElementById("email").value,
            phone: document.getElementById("phone").value,
            message: document.getElementById("message").value,
          });
          window.location.href = "contact-confirm.html?" + params.toString();
        });
    </script>
  </body>
</html>
